    <!-- Fonts: Plus Jakarta Sans with font-display: block -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Entrance synchronization script -->
    <script>
      (function () {
        if (
          window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches
        )
          return;
        var d = document.documentElement;
        d.classList.add('anim');
        var started = false;
        function clean() {
          window.removeEventListener('animationend', onEnd, true);
          d.classList.remove('anim');
          d.classList.remove('go');
        }
        function onEnd(e) {
          if (
            e.animationName === 'pillIn' &&
            e.target &&
            e.target.classList &&
            e.target.classList.contains('btn-ghost')
          ) {
            clean();
          }
        }
        function start() {
          if (started) return;
          started = true;
          window.addEventListener('animationend', onEnd, true);
          setTimeout(clean, 2600);
          d.classList.add('go');
        }
        var bootTimer = setTimeout(start, 900);
        function boot() {
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(
              function () {
                clearTimeout(bootTimer);
                start();
              },
              function () {
                clearTimeout(bootTimer);
                start();
              }
            );
          } else {
            start();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot);
        } else {
          boot();
        }
      })();
    </script>
